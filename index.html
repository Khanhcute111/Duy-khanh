<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d"><title>DK Site — AI Ultra Sharp</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#14141c;--line:#292936;--red:#ff334f;--muted:#a5a5b5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#3c101c 0,transparent 42%),var(--bg);color:#f7f7fb;font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{width:min(760px,100%);margin:auto;padding:28px 18px 54px}.top{display:flex;align-items:center;gap:12px;margin-bottom:30px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#ff5369,#a40025);display:grid;place-items:center;font-weight:900;font-size:19px;box-shadow:0 8px 30px #ff334f33}.brand{font-weight:850;letter-spacing:.12em}.tag{color:var(--muted);font-size:12px}
h1{font-size:clamp(30px,7vw,48px);line-height:1.04;margin:14px 0 12px;letter-spacing:-.04em}h1 span{color:#ff5269}.sub{color:var(--muted);line-height:1.6;margin:0 0 25px}
.panel{background:linear-gradient(145deg,#191923,#111118);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 70px #0005}
.drop{border:1.5px dashed #555568;border-radius:17px;min-height:190px;display:grid;place-items:center;text-align:center;padding:18px;cursor:pointer;overflow:hidden}.drop img{max-width:100%;max-height:330px;object-fit:contain;border-radius:12px}.drop strong{display:block;margin:9px 0 5px}.muted{color:var(--muted);font-size:13px}
input[type=file]{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:13px;padding:14px 18px;font-weight:750;cursor:pointer;font-size:14px}.primary{background:linear-gradient(110deg,#ff5269,#c90032);color:white;flex:1;min-width:170px}.secondary{background:#292936;color:#eee}.btn:disabled{opacity:.45;cursor:not-allowed}.status{min-height:24px;margin:13px 2px 0;color:#ff9baa;font-size:13px}.result{display:none;margin-top:18px}.result img{width:100%;border-radius:14px;display:block}.result a{display:inline-block;margin-top:12px;color:#ff8293;font-weight:700}.foot{text-align:center;color:#747486;font-size:12px;margin-top:25px}
@media(min-width:650px){main{padding-top:44px}.panel{padding:24px}}
</style></head>
<body><main>
<header class="top"><div class="logo">DK</div><div><div class="brand">DK SITE</div><div class="tag">AI IMAGE ENHANCEMENT</div></div></header>
<h1>Ảnh rõ nét hơn.<br><span>Chi tiết vượt trội.</span></h1>
<p class="sub">Nâng cấp ảnh bằng AI Real-ESRGAN trên Cloud. Phóng đại 4x, giữ trải nghiệm đơn giản ngay trên điện thoại.</p>
<section class="panel">
<label class="drop" for="file" id="drop"><div id="placeholder"><div style="font-size:34px">＋</div><strong>Chọn ảnh cần làm nét</strong><span class="muted">JPG, PNG hoặc WEBP · tối đa 15 MB</span></div><img id="preview" alt="Ảnh gốc" hidden></label>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp">
<div class="actions"><button class="btn secondary" id="choose" type="button">Chọn ảnh</button><button class="btn primary" id="run" type="button" disabled>✨ Làm nét AI 4x</button></div>
<div class="status" id="status" role="status"></div>
<div class="result" id="result"><h3>Ảnh sau xử lý</h3><img id="after" alt="Ảnh đã tăng nét"><a id="download" download="DK-Site-UltraSharp.png">Tải ảnh chất lượng cao ↓</a></div>
</section><div class="foot">DK Site · AI xử lý trên máy chủ · Không đưa API key lên trình duyệt</div>
</main>
<script>
const file=document.getElementById('file'),preview=document.getElementById('preview'),placeholder=document.getElementById('placeholder'),run=document.getElementById('run'),status=document.getElementById('status'),result=document.getElementById('result');let selected=null,objectUrl=null;
function chooseFile(f){if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){status.textContent='Định dạng ảnh không được hỗ trợ.';return}if(f.size>15*1024*1024){status.textContent='Ảnh vượt quá 15 MB.';return}selected=f;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);preview.src=objectUrl;preview.hidden=false;placeholder.hidden=true;run.disabled=false;status.textContent='Đã chọn: '+f.name;result.style.display='none'}
file.addEventListener('change',e=>chooseFile(e.target.files[0]));document.getElementById('choose').onclick=()=>file.click();document.getElementById('drop').addEventListener('dragover',e=>e.preventDefault());document.getElementById('drop').addEventListener('drop',e=>{e.preventDefault();chooseFile(e.dataTransfer.files[0])});
run.onclick=async()=>{if(!selected)return;run.disabled=true;status.textContent='AI đang xử lý ảnh trên Cloud…';result.style.display='none';try{const data=new FormData();data.append('image',selected);const res=await fetch('/api/enhance',{method:'POST',body:data});if(!res.ok){let msg='Không thể xử lý ảnh.';try{msg=(await res.json()).detail||msg}catch{}throw new Error(msg)}const blob=await res.blob();const url=URL.createObjectURL(blob);document.getElementById('after').src=url;document.getElementById('download').href=url;result.style.display='block';status.textContent='Hoàn tất! Ảnh đã được nâng cấp 4x.'}catch(e){status.textContent=e.message||'Có lỗi xảy ra. Vui lòng thử lại.'}finally{run.disabled=false}};
</script></body></html>
